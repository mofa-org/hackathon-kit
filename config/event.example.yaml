# Hackathon Kit — Event Configuration Example
# Copy this to config/event.yaml and fill in your event details.
# Fill in your event details below.

event:
  name: "Your Hackathon Name"
  tagline: "Your Tagline Here"
  organizer: "Your Organization"
  dates: "June 15–16, 2026"
  start_time: "2026-06-15T09:00:00+02:00"   # ISO 8601 — used by countdown timer
  end_time: "2026-06-16T20:00:00+02:00"
  venue: "Venue Name"
  city: "City"
  address: "123 Main Street, 00000 City"
  contact_email: "hello@example.com"
  site_url: "https://your-hackathon.example.com"
  discord_url: "https://discord.gg/your-invite"
  main_site_url: "https://your-org.example.com"

sponsors:
  - name: "Sponsor A"
    logo: "/sponsors/sponsor-a.svg"
    logo_wide: "/sponsors/sponsor-a-wide.svg"
    url: "https://sponsor-a.example.com"
    award_name: "Sponsor A Award"
    award_prize: "$2,000 Cash"
  - name: "Sponsor B"
    logo: "/sponsors/sponsor-b.svg"
    logo_wide: "/sponsors/sponsor-b-wide.svg"
    url: "https://sponsor-b.example.com"
    award_name: "Sponsor B Award"
    award_prize: "$2,000 Cash"

awards:
  total_pool: "$10,000"
  count: 5
  organizer_awards:
    - name: "Best Overall"
      prize: "$2,000 Cash"
    - name: "Most Innovative"
      prize: "$2,000 Cash"

themes:
  - number: "01"
    title: "Theme One"
    subtitle: "Subtitle for Theme One"
    description: "Description of this track."
    detail: "Detailed explanation of what participants should build."
    directions:
      - "Direction A"
      - "Direction B"
  - number: "02"
    title: "Theme Two"
    subtitle: "Subtitle for Theme Two"
    description: "Description of this track."
    detail: "Detailed explanation."
    directions:
      - "Direction A"
      - "Direction B"

judging:
  criteria:
    - name: "Innovation"
      weight: "20%"
      description: "Originality and novelty of the idea"
    - name: "Technical Depth"
      weight: "20%"
      description: "Architecture, code quality, technical complexity"
    - name: "Completeness"
      weight: "20%"
      description: "Working demo, functional completeness"
    - name: "Practicality"
      weight: "20%"
      description: "Real-world problem-solving potential"
    - name: "Presentation"
      weight: "20%"
      description: "Clarity and persuasiveness of the demo"

schedule:
  day1:
    label: "Day 1 — June 15"
    items:
      - time: "09:00–09:30"
        title: "Check-in"
      - time: "09:30–10:00"
        title: "Opening Ceremony"
      - time: "10:00–12:00"
        title: "Hacking"
      - time: "12:00–13:00"
        title: "Lunch"
      - time: "13:00–18:00"
        title: "Hacking"
  day2:
    label: "Day 2 — June 16"
    items:
      - time: "09:00–12:00"
        title: "Hacking"
      - time: "12:00–13:00"
        title: "Demo Presentations"
      - time: "13:00–14:00"
        title: "Judging"
      - time: "15:00"
        title: "Awards Ceremony"

faq:
  - q: "Who can participate?"
    a: "Anyone who can attend in person at the venue."
  - q: "How big can teams be?"
    a: "Teams of 1–3 people."
  - q: "Is it free?"
    a: "Yes! Registration is free."
